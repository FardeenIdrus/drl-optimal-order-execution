    <rect x="1050" y="135" width="120" height="9" fill="#0072B2"/>
    <rect x="1075" y="120" width="95"  height="9" fill="#0072B2"/>
    <rect x="1095" y="105" width="75"  height="9" fill="#0072B2"/>
    <rect x="1112" y="90"  width="58"  height="9" fill="#0072B2"/>
    <rect x="1178" y="90"  width="46"  height="9" fill="#D55E00"/>
    <rect x="1178" y="105" width="62"  height="9" fill="#D55E00"/>
    <rect x="1178" y="120" width="80"  height="9" fill="#D55E00"/>
