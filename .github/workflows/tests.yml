name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch first: the default PyPI wheel bundles CUDA libraries the
      # suite does not need. Version matches the requirements.txt pin.
      - run: pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest tests -q
        env:
          PYTHONPATH: src
