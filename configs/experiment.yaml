# Experiment configuration (RL environment + agents).
# Single source of truth for env/agent parameters, analogous to pipeline.yaml for
# the data pipeline. Dataset location is passed at runtime via --scratch-root
# (data lives outside the repo); dataset_dir selects the subdir under it.
# The finer-resolution variant is configs/experiment_10s.yaml.

bar_seconds: 60               # bar width (s); n_steps * bar_seconds = 1800s = 30-min horizon
dataset_dir: dataset          # 60s dataset under --scratch-root (10s lives in dataset_10s/)

env:
  # Meta-order sized as a % of ADV. ADV = 19,313 BTC (BTC daily
  # volume from the Hyperliquid candle API, 2024-2025; cached in
  # scratch/adv/btc_adv.json). Primary = 0.5% of ADV: meaningful impact for a
  # measurable RL edge; slice 3.2 BTC/min vs volatile per-step depth median 22 /
  # p10 9.5. Deadline residual under naive TWAP fires 2.26% of test episodes (mean
  # 3.9 BTC), priced + logged; the adaptive agent should finish better. The gate
  # runs at every sweep size {0.1,0.25,0.5,1.0}%; the primary must pass.
  initial_inventory: 96.57    # BTC = 0.50% of ADV (primary / headline)
  adv_btc: 19313.4
  order_size_pct_adv: 0.5
  # Descriptive only: no code reads these two fields. They list the sizes ACTUALLY
  # trained for this dataset version; the authority is each run's meta.json.
  # Corrected 2026-08-09 -- the field had listed a planned 0.1-1.0% ladder never run.
  # 386.27 was trained on the 10-second/30-minute version only, not this one.
  order_size_sweep_pct_adv: [0.5, 1.0]
  order_size_sweep_btc: [96.57, 193.13]
  n_steps: 30                 # decisions per episode (30-min horizon, 1-min steps)
  final_penalty: 1.0          # reward penalty per BTC of unexecuted inventory (training)
  # Action = MULTIPLE of the TWAP pace: qty = mult * (remaining inventory /
  # steps_left). The mult=1.0 action reproduces TWAP at every step, so the policy
  # can match TWAP by construction (fair "beat TWAP" test) and is interpretable as
  # deviation-from-TWAP; fine resolution near 1.0 captures a small well-timed edge.
  # Supersedes the earlier fraction-of-remaining grid, which (coarse) could not
  # represent TWAP's per-step pace and forced lumpy front-loading.
  action_mode: twap_pace_multiple
  actions: [0.0, 0.5, 0.8, 1.0, 1.2, 1.5, 2.0]

obs:
  # Microstructure features added to the observation (Step 2), on top of the
  # execution state [inventory, time]. Normalization (log1p for the heavy-tailed
  # positives + train-fit standardize) is defined in execution.env.normalize.
  features: [spread_bps, imbalance, recent_return, rolling_vol, ask_depth]

split:
  # Validation carved chronologically from the END of train.parquet (most recent,
  # adjacent to the test boundary) for the generalization gate. The
  # normalizer is fit on the training sub-split ONLY (leakage-free); TEST stays
  # sealed until final evaluation. See EpisodeStore.chrono_split.
  val_frac: 0.15

agent:
  # Training. Reward = negative per-step IS in BPS of arrival notional
  # (well-conditioned; same objective as the is_bps eval metric). Device cpu (the
  # probe showed MPS ~9x slower for this small net). Budget is a starting value;
  # extend if the validation curve has not plateaued (never trade rigor for speed).
  device: cpu
  reward_bps: true
  leftover_penalty_bps: 100.0   # full order left unexecuted = 100 bps (scaled by
                                # fraction left) -> dominates the single-digit-bps IS
                                # so the agent learns to finish on its own.
  total_timesteps: 2000000      # ~6 min/run on CPU (probe); extend per the curve.
  seeds: [0, 1, 2, 3, 4]
  dqn:                          # mirrors the QRM scaffold (arXiv 2511.15262)
    net_arch: [30, 30, 30, 30, 30]
    activation: LeakyReLU
    learning_rate: 0.0001
    buffer_size: 1000000
    batch_size: 1024
    learning_starts: 40000
    gamma: 0.995
    train_freq: 100
    gradient_steps: 1
    target_update_interval: 1000
    n_steps: 1
    exploration_initial_eps: 1.0
    exploration_final_eps: 0.01
    # exploration_fraction is DERIVED from the budget, not fixed:
    # anneal epsilon over the warmup PLUS the first `exploration_anneal_frac` of the
    # post-warmup learning phase, so it scales with total_timesteps and never decays
    # before learning_starts. QRM's fixed 0.03 was tuned to their 6.24M budget and
    # finished annealing at 15k steps -- inside our 40k warmup -- leaving the agent
    # near-greedy throughout learning. learning_starts stays ABSOLUTE (buffer fill,
    # not training length). At 2M-6M this rule yields ~0.26; recorded per run.
    exploration_anneal_frac: 0.25

  ppo:                          # PPO is NEW (the QRM scaffold had only DQN). Standard,
                                # well-established SB3 settings, with the SAME [30x5] LeakyReLU
                                # trunk and gamma as the DQN so the DQN-vs-PPO comparison
                                # isolates the algorithm, plus a small entropy bonus to avoid
                                # premature collapse to a constant TWAP-pace policy. PPO is
                                # on-policy: no replay buffer, no epsilon (it explores via its
                                # stochastic policy + ent_coef).
    net_arch: [30, 30, 30, 30, 30]   # same [30x5] trunk as DQN (fair like-for-like)
    activation: LeakyReLU
    learning_rate: 0.0003       # SB3 PPO default
    n_steps: 2048               # rollout length per update (~68 of the 30-step episodes)
    batch_size: 64
    n_epochs: 10
    gamma: 0.995                # MATCHED to the DQN (not PPO's 0.99 default)
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01              # small exploration bonus (default 0.0); avoids TWAP-collapse
    vf_coef: 0.5
    max_grad_norm: 0.5
